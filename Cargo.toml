[workspace]
resolver = "2"
members = ["crates/mk-core", "crates/mk-cli", "crates/mk-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/todorx/macedonian-text"

[workspace.dependencies]
fst = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
